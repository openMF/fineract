name: Fineract Publish to DockerHub
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DEVELOCITY_ACCESS_KEY:
        required: false
      DOCKERHUB_USER:
        required: false
      DOCKERHUB_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  build:
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref_name == 'develop' ||
          startsWith(github.ref_name, 'release/') ||
          startsWith(github.ref_name, '1.')
        )
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Download workspace
        id: download-workspace
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: fineract-workspace-${{ github.run_id }}
          path: .

      - name: Extract workspace
        if: steps.download-workspace.outcome == 'success'
        run: tar -xf fineract-workspace.tar

      - name: Checkout
        if: steps.download-workspace.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Build workspace fallback
        if: steps.download-workspace.outcome != 'success'
        uses: $/.github/actions/setup-and-build-fineract
        with:
          cache-read-only: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Apply Gradle memory budget
        uses: $/.github/actions/gradle-memory-budget
        with:
          max-heap: '4g'
          workers-max: '2'

      - name: Get Git Hashes
        run: |
          echo "short_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "long_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        id: git_hashes

      - name: Determine image tags
        id: image_tags
        env:
          REF_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ steps.git_hashes.outputs.short_hash }}
          LONG_HASH: ${{ steps.git_hashes.outputs.long_hash }}
        run: |
          TAGS=$REF_NAME
          if [ "$TAGS" == "develop" ]; then
            TAGS="$TAGS,$SHORT_HASH,$LONG_HASH"
          else
            TAGS=$(git tag --points-at HEAD | grep -E '^1\.' | head -n 1 || true)
            if [ -z "$TAGS" ]; then
              echo "Skipping DockerHub publish because this run is not for develop or a 1.* tag."
            fi
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # The published image is built on a Docker Hardened Image (dhi.io), which needs a Docker account to pull; the
      # DockerHub credentials are used for that as well. PR builds keep the public base image (no secrets there).
      # Nothing else in CI runs the hardened variant, so start it once before pushing it.
      - name: Smoke test the hardened image
        if: steps.image_tags.outputs.tags != ''
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USER" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USER and DOCKERHUB_TOKEN are needed to pull the hardened base image from dhi.io"
            exit 1
          fi
          ./gradlew --no-daemon --console=plain :fineract-provider:jibDockerBuild -x test -x cucumber -x buildJavaSdk \
            -Pfineract.docker.hardened=true \
            -Djib.from.auth.username="$DOCKERHUB_USER" \
            -Djib.from.auth.password="$DOCKERHUB_TOKEN" \
            -Djib.to.image=fineract-hardened-smoke
          .github/scripts/smoke-test-docker-image.sh fineract-hardened-smoke

      - name: Build and push the Apache Fineract image
        if: steps.image_tags.outputs.tags != ''
        env:
          TAGS: ${{ steps.image_tags.outputs.tags }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon --console=plain :fineract-provider:jib -x test -x cucumber -x buildJavaSdk \
            -Pfineract.docker.hardened=true \
            -Djib.from.auth.username="$DOCKERHUB_USER" \
            -Djib.from.auth.password="$DOCKERHUB_TOKEN" \
            -Djib.to.auth.username="$DOCKERHUB_USER" \
            -Djib.to.auth.password="$DOCKERHUB_TOKEN" \
            -Djib.from.platforms=linux/amd64,linux/arm64 \
            -Djib.to.image=apache/fineract \
            -Djib.to.tags="$TAGS"
